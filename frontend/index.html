<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DynamoDB Songs - Main</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>DynamoDB Songs</h1>
    <nav>
      <a href="login.html">Login</a> |
      <a href="register.html">Register</a>
    </nav>
  </header>
  <div id="flash" class="flash" style="display:none"></div>

  <main>
    <section id="songs">
      <h2>Song list (placeholder)</h2>
      <section id="search" style="margin-bottom:18px;">
        <h3>Search</h3>
        <div class="form-grid">
          <div>
            <h4>By title + artist</h4>
            <label>Title: <input id="q-title" name="title"></label>
            <label>Artist: <input id="q-artist" name="artist"></label>
            <div class="container-row"><button id="search-title-artist">Search</button></div>
          </div>

          <div>
            <h4>By album + artist</h4>
            <label>Album: <input id="q-album" name="album"></label>
            <label>Artist: <input id="q-artist2" name="artist"></label>
            <div class="container-row"><button id="search-album-artist">Search</button></div>
          </div>
        </div>

        <div style="margin-top:12px;">
          <h4>By artist + year</h4>
          <label>Artist: <input id="q-artist3" name="artist"></label>
          <label>Year: <input id="q-year" name="year"></label>
          <div class="container-row"><button id="search-artist-year">Search</button></div>
        </div>
      </section>
      <p>This page will list songs and allow image upload to S3 via presigned URLs.</p>
      <div id="song-list"></div>

      <h3>Upload song image and metadata</h3>
      <form id="upload-form">
        <div class="form-grid">
          <label>Artist: <input name="artist" required></label>
          <label>Title: <input name="title" required></label>
        </div>
        <div class="form-grid">
          <label>Album: <input name="album"></label>
          <label>Year: <input name="year"></label>
        </div>
        <label>Image: <input type="file" name="image" accept="image/*" required></label>
        <div class="container-row">
          <button type="submit">Upload</button>
          <button type="button" class="secondary" id="clear-form">Clear</button>
        </div>
      </form>
      <p id="upload-result"></p>
    </section>
  </main>

  <script src="api.js"></script>
  <script>
    // show one-time flash message set by login/register flows
    (function(){
      try {
        const msg = localStorage.getItem('flash');
        if (msg) {
          const el = document.getElementById('flash');
          el.textContent = msg;
          el.style.display = 'block';
          // clear after showing
          localStorage.removeItem('flash');
          setTimeout(()=> el.style.display='none', 4500);
        }
      } catch(e){ /* ignore */ }
    })();
    // Placeholder to fetch songs via API
    async function loadSongs() {
      // Call /api/songs (not implemented yet)
      const el = document.getElementById('song-list');
      try {
        const res = await api.get('/api/songs');
        if (res.songs) {
          el.innerHTML = res.songs.map(s => `
            <div class="song-card">
              <img src="${s.image_url||''}" alt="${s.title}"/>
              <h4>${s.title}</h4>
              <p>${s.artist} — ${s.album || ''} (${s.year || ''})</p>
            </div>
          `).join('\n');
        } else {
          el.textContent = 'No songs returned';
        }
      } catch (e) {
        el.textContent = 'Failed to load songs: ' + e.message;
      }
    }

    loadSongs();

    // Search handlers that use backend query when available or fallback to client filter
    async function renderSongsList(list) {
      const el = document.getElementById('song-list');
      el.innerHTML = list.map(s => `
            <div class="song-card">
              <img src="${s.image_url||''}" alt="${s.title||''}"/>
              <h4>${s.title||''}</h4>
              <p>${s.artist||''} — ${s.album || ''} (${s.year || ''})</p>
            </div>
          `).join('\n');
    }

    document.getElementById('search-title-artist').addEventListener('click', async ()=>{
      const title = document.getElementById('q-title').value;
      const artist = document.getElementById('q-artist').value;
      const res = await api.querySongs({ type: 'title-artist', title, artist });
      if (res.songs) renderSongsList(res.songs);
    });

    document.getElementById('search-album-artist').addEventListener('click', async ()=>{
      const album = document.getElementById('q-album').value;
      const artist = document.getElementById('q-artist2').value;
      const res = await api.querySongs({ type: 'album-artist', album, artist });
      if (res.songs) renderSongsList(res.songs);
    });

    document.getElementById('search-artist-year').addEventListener('click', async ()=>{
      const artist = document.getElementById('q-artist3').value;
      const year = document.getElementById('q-year').value;
      const res = await api.querySongs({ type: 'artist-year', artist, year });
      if (res.songs) renderSongsList(res.songs);
    });

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const file = form.image.files[0];
      if (!file) return;

      // choose a key for the file
      const key = `${Date.now()}_${file.name}`;
      const bucket = 'YOUR_BUCKET_NAME'; // replace

      // request presigned URL
      const presign = await api.presignUpload(bucket, key);
      if (!presign.url) {
        document.getElementById('upload-result').textContent = 'Presign failed: ' + JSON.stringify(presign);
        return;
      }

      // upload file to S3
      const up = await api.uploadToS3(presign.url, file);
      if (!up.success) {
        document.getElementById('upload-result').textContent = 'Upload failed: ' + JSON.stringify(up);
        return;
      }

      // save metadata to backend
      const songKey = form.title.value + '#' + form.album.value + '#' + form.year.value;
      const meta = {
        artist: form.artist.value,
        songKey: songKey,
        title: form.title.value,
        album: form.album.value,
        year: form.year.value,
        image_url: `https://${bucket}.s3.amazonaws.com/${key}`
      };

      const saved = await api.post('/api/songs', meta);
      if (saved.success) {
        document.getElementById('upload-result').textContent = 'Saved';
        loadSongs();
      } else {
        document.getElementById('upload-result').textContent = 'Save failed: ' + JSON.stringify(saved);
      }
    });
  </script>
</body>
</html>
