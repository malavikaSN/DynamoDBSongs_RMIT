name: Deploy to ECS and run E2E

on:
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: mvn -DskipTests package

      - name: Log in to AWS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to ECS (update service)
        run: |
          echo "Deploy to ECS using aws cli or CloudFormation (not included by default)."
          echo "Please add deployment steps or CFN template to update ECS service."

      - name: Install Node and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright
        run: |
          npm ci || npm i --no-audit --no-fund @playwright/test

      - name: Run Playwright tests
        env:
          TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}
        run: |
          npx playwright install --with-deps
          npx playwright test --reporter=list || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: tests/playwright/**/*
